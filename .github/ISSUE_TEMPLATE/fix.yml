name: Bug
description: Report something broken or unexpected in berth
title: "fix: "
labels: ["fix", "bug"]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What did berth actually do or output?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Minimal steps, command invocations, or berth.yaml configuration.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS (macOS/Linux/Windows), Go version, git version.

