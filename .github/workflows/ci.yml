name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      BERTH_TEST_REQUIRE_NATIVE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned native supervisor
        shell: bash
        run: |
          set -euo pipefail
          export BERTH_HOME="${RUNNER_TEMP}/berth-tools"
          go run ./cmd/berth doctor --fix
          echo "$BERTH_HOME/bin/process-compose-v1.122.0" >> "$GITHUB_PATH"
      - name: Format, vet and tests
        shell: bash
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then printf '%s\n' "$unformatted"; exit 1; fi
          go vet ./cmd/... ./internal/...
          go test -race -count=1 ./cmd/... ./internal/...
      - name: Staticcheck
        if: runner.os == 'Linux'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./cmd/... ./internal/...
      - name: Build
        run: go build ./cmd/berth
      - name: Real native CLI acceptance test (no skip)
        shell: bash
        run: python tests/native_e2e.py ./berth${{ runner.os == 'Windows' && '.exe' || '' }}
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build shared runtime image once
        run: docker build -t berth-runtime:test -f runtime/Dockerfile .
      - name: Build berth
        run: go build -o /tmp/berth ./cmd/berth
      - name: Real container acceptance test (no skip)
        run: python3 tests/container_e2e.py /tmp/berth berth-runtime:test
