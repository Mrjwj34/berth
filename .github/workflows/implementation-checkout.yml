name: implementation-checkout
on:
  push:
    branches: [feat/reliable-local-workspaces]
    paths: [.github/workflows/implementation-checkout.yml]
permissions:
  contents: read
jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Package source and offline validation toolchain
        shell: bash
        run: |
          set -euo pipefail
          go mod vendor
          mkdir -p /tmp/lane-validation/source
          git archive HEAD | tar -x -C /tmp/lane-validation/source
          cp -a vendor /tmp/lane-validation/source/vendor
          tar -czf /tmp/lane-validation/go-toolchain.tar.gz -C "$(go env GOROOT)" .
          tar -czf /tmp/lane-validation/source.tar.gz -C /tmp/lane-validation/source .
      - uses: actions/upload-artifact@v4
        with:
          name: offline-validation
          path: |
            /tmp/lane-validation/go-toolchain.tar.gz
            /tmp/lane-validation/source.tar.gz
          retention-days: 1
