name: apply-reviewed-implementation
on:
  push:
    branches: [feat/reliable-local-workspaces]
    paths: [.github/workflows/apply-implementation.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reliable-local-workspaces
          fetch-depth: 2
      - name: Materialize verified implementation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/lane-changes.xz
          for sha in \
            3e3e3404d85e7eaaa8ebcbf68c1747d4ed642e77 \
            c1a2b16b500a10b8dc4c2563f810d0c6dc0c816a \
            8443cc1777f9ccd623cfee30fbe10bf2cc6018dc \
            445bf21df384861c6ae025d5a8d580ceaceee36f \
            21827f15ab1ae6a6b268d7b097f782af4eeda488 \
            2c04bae9c10582f0a0334346aa9695f7bee3cb35 \
            698b5d08950c6eac6d7828aba91452311c33876d \
            27ed8e5dd4aeefe1a0206753aa7e97200ef9bc94; do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq '.content' | base64 --decode >> /tmp/lane-changes.xz
          done
          python3 - <<'PY'
          import hashlib, json, lzma, pathlib, subprocess
          data = lzma.decompress(pathlib.Path('/tmp/lane-changes.xz').read_bytes())
          expected = '0182968b72b530a8afc6807173c440a961cef5374e9a99e05bb11fc3490b7bd1'
          assert hashlib.sha256(data).hexdigest() == expected, 'manifest checksum mismatch'
          manifest = json.loads(data)
          paths = []
          for change in manifest['changes']:
              path = pathlib.PurePosixPath(change['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              original = subprocess.run(['git', 'rev-parse', '--verify', 'HEAD:' + str(path)], capture_output=True, text=True)
              old = original.stdout.strip() if original.returncode == 0 else None
              assert old == change['old'], f'concurrent modification: {path}: {old} != {change["old"]}'
              paths.append(str(path))
          for change in manifest['changes']:
              path = pathlib.Path(change['path'])
              if change['content'] is None:
                  path.unlink()
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(change['content'].encode('utf-8'))
          subprocess.run(['git', 'add', '--all', '--', *paths], check=True)
          subprocess.run(['git', 'rm', '--', '.github/workflows/apply-implementation.yml'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == manifest['tree'] == 'a5600faa3e2119c640809919bd714fa1c1f67edd', f'final tree mismatch: {tree}'
          print('Verified implementation tree:', tree)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: reliable local workspaces with reusable isolated runtimes'
          git push origin HEAD:refs/heads/feat/reliable-local-workspaces
